services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""               
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: aips_db
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/seeds/aips_db.sql:/docker-entrypoint-initdb.d/aips_db.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy  
    environment:
      DATABASE_URL: "mysql+pymysql://root:@db:3306/aips_db"
      SECRET_KEY: ${SECRET_KEY}      
      CORS_ORIGINS: "http://localhost:3000"
      YOLO_DEVICE: "cpu"             
    volumes:
      - ./backend/ml:/app/ml
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_HOST: "localhost:8000" 
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data: